name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Build direct-distribution debug APK
        run: gradle --no-daemon assembleDirectDebug

      - name: Run unit tests
        run: gradle --no-daemon testDirectDebugUnitTest
