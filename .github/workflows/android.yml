name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install stable Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build direct-distribution debug APK with live search endpoint
        env:
          ATLAS_SEARCH_API_BASE_URL: https://atlas-search-api-production.up.railway.app
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PATLAS_SEARCH_API_BASE_URL="$ATLAS_SEARCH_API_BASE_URL" \
            assembleDirectDebug

      - name: Run Android unit tests
        env:
          ATLAS_SEARCH_API_BASE_URL: https://atlas-search-api-production.up.railway.app
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PATLAS_SEARCH_API_BASE_URL="$ATLAS_SEARCH_API_BASE_URL" \
            testDirectDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-atlas-direct-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  search-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install search API test dependencies
        run: python -m pip install --upgrade -r services/search_api/requirements.txt pytest
      - name: Run search relevance and safety tests
        working-directory: services/search_api
        run: python -m pytest tests -q
