name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install stable Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build direct-distribution debug APK with live search endpoint
        env:
          ATLAS_SEARCH_API_BASE_URL: https://atlas-search-api-production.up.railway.app
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PATLAS_SEARCH_API_BASE_URL="$ATLAS_SEARCH_API_BASE_URL" \
            assembleDirectDebug

      - name: Run Android unit tests
        env:
          ATLAS_SEARCH_API_BASE_URL: https://atlas-search-api-production.up.railway.app
        run: |
          ./gradlew --no-daemon --stacktrace \
            -PATLAS_SEARCH_API_BASE_URL="$ATLAS_SEARCH_API_BASE_URL" \
            testDirectDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-atlas-direct-debug
          path: app/build/outputs/apk/direct/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  search-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install search API test dependencies
        run: python -m pip install --upgrade -r services/search_api/requirements.txt pytest
      - name: Run search relevance and safety tests
        working-directory: services/search_api
        run: python -m pytest tests -q

  live-search-smoke:
    runs-on: ubuntu-latest
    needs: [search-api-tests]
    steps:
      - name: Verify deployed search readiness and a real Arabic search
        env:
          ATLAS_SEARCH_API_BASE_URL: https://atlas-search-api-production.up.railway.app
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://atlas-search-api-production.up.railway.app"
          last_error = None
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base + "/health/ready", timeout=12) as response:
                      if response.status != 200:
                          raise RuntimeError(f"Readiness returned HTTP {response.status}")
                      readiness = json.loads(response.read().decode("utf-8"))
                      if readiness.get("status") != "ready":
                          raise RuntimeError(f"Unexpected readiness body: {readiness}")
                  break
              except Exception as exc:
                  last_error = exc
                  if attempt == 5:
                      raise SystemExit(f"Live search readiness failed: {last_error}") from exc
                  time.sleep(10)

          payload = json.dumps({
              "query": "ملوحة التربة",
              "language": "ar",
              "mode": "hybrid",
              "limit": 5
          }).encode("utf-8")
          request = urllib.request.Request(
              base + "/search",
              data=payload,
              headers={"Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=35) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Search returned HTTP {response.status}")
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")[:1000]
              raise SystemExit(f"Live search returned HTTP {exc.code}: {detail}") from exc

          hits = result.get("results")
          if not isinstance(hits, list) or not hits:
              raise SystemExit(f"Search returned no usable results: {result}")
          invalid = [hit.get("url") for hit in hits if not str(hit.get("url", "")).startswith("https://")]
          if invalid:
              raise SystemExit(f"Search returned non-HTTPS URLs: {invalid}")
          print(f"Readiness: {readiness}")
          print(f"Arabic query returned {len(hits)} HTTPS result(s).")
          for hit in hits[:5]:
              print(f"- {hit.get('title', '(untitled)')} | {hit.get('publisher', '')} | {hit.get('url', '')}")
          PY
