name: Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version, for example 1.0.1"
        required: true
        type: string
      version_code:
        description: "Positive integer greater than the previous release"
        required: true
        type: string
      release_notes:
        description: "Short release notes"
        required: false
        type: string
        default: "تحسينات وإصلاحات"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Validate release inputs and decode keystore
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.ATLAS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version_code must be a positive integer."
            exit 1
          fi
          if [[ -z "$VERSION_NAME" || ${#VERSION_NAME} -gt 40 ]]; then
            echo "::error::version_name must contain 1 to 40 characters."
            exit 1
          fi
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing ATLAS_RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/atlas-release.jks"
          chmod 600 "$RUNNER_TEMP/atlas-release.jks"
      - name: Build signed release APK and run tests
        env:
          ATLAS_RELEASE_STORE_FILE: ${{ runner.temp }}/atlas-release.jks
          ATLAS_RELEASE_STORE_PASSWORD: ${{ secrets.ATLAS_RELEASE_STORE_PASSWORD }}
          ATLAS_RELEASE_KEY_ALIAS: ${{ secrets.ATLAS_RELEASE_KEY_ALIAS }}
          ATLAS_RELEASE_KEY_PASSWORD: ${{ secrets.ATLAS_RELEASE_KEY_PASSWORD }}
          ATLAS_SEARCH_API_BASE_URL: ${{ vars.ATLAS_SEARCH_API_BASE_URL }}
          ATLAS_UPDATE_MANIFEST_URL: ${{ vars.ATLAS_UPDATE_MANIFEST_URL }}
          ATLAS_VERSION_CODE: ${{ inputs.version_code }}
          ATLAS_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          for name in ATLAS_RELEASE_STORE_PASSWORD ATLAS_RELEASE_KEY_ALIAS ATLAS_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name."
              exit 1
            fi
          done
          ./gradlew --no-daemon --stacktrace \
            -PATLAS_VERSION_CODE="$ATLAS_VERSION_CODE" \
            -PATLAS_VERSION_NAME="$ATLAS_VERSION_NAME" \
            -PATLAS_SEARCH_API_BASE_URL="${ATLAS_SEARCH_API_BASE_URL:-}" \
            -PATLAS_UPDATE_MANIFEST_URL="${ATLAS_UPDATE_MANIFEST_URL:-}" \
            assembleDirectRelease testDirectReleaseUnitTest
      - name: Verify signature and create update manifest
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          PUBLIC_APK_URL: ${{ vars.ATLAS_PUBLIC_APK_URL }}
        run: |
          APK_PATH="$(find app/build/outputs/apk/direct/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          export APK_PATH
          python - <<'PY'
          import hashlib, json, os
          apk_path = os.environ["APK_PATH"]
          with open(apk_path, "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()
          manifest = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": os.environ.get("PUBLIC_APK_URL", "").strip(),
              "sha256": digest,
              "releaseNotes": os.environ.get("RELEASE_NOTES", "")[:1000],
          }
          if not manifest["apkUrl"].startswith("https://"):
              raise SystemExit("ATLAS_PUBLIC_APK_URL must be a public HTTPS URL before publishing the updater manifest.")
          with open("stable-update-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          sha256sum "$APK_PATH" > release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-atlas-direct-release
          path: |
            app/build/outputs/apk/direct/release/*.apk
            stable-update-manifest.json
            release-sha256.txt
          if-no-files-found: error
          retention-days: 30
