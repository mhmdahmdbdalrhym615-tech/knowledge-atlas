use_default_settings: true

general:
  debug: false
  instance_name: "Knowledge Atlas Search"

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  secret_key: "${SEARXNG_SECRET}"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: true
  image_proxy: true

valkey:
  url: valkey://valkey:6379/0
