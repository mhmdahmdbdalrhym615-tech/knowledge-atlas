use_default_settings: true

general:
  debug: false
  instance_name: "Knowledge Atlas Search"

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: true
  image_proxy: true
  # Secret key is injected at runtime through SEARXNG_SECRET.

valkey:
  # SearXNG uses Valkey for its limiter when enabled.
  url: valkey://valkey:6379/0
