use_default_settings: true

general:
  debug: false
  instance_name: "Knowledge Atlas Search"

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: true
  image_proxy: false
  # Set SEARXNG_SECRET as a Railway runtime variable.

valkey:
  # Railway private network endpoint.
  url: valkey://valkey.railway.internal:6379/0
