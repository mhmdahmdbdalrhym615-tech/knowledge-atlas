use_default_settings:
  engines:
    remove:
      - ahmia
      - torch

general:
  debug: false
  instance_name: "Knowledge Atlas Search"

search:
  formats:
    - html
    - json
  safe_search: 1

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: true
  image_proxy: false

valkey:
  url: valkey://valkey.railway.internal:6379/0
